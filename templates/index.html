<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Event Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Kubernetes Event Monitor</h1>
        <button id="fetchEvents">Buscar Eventos</button>
        <div id="output">
            <h2>Eventos:</h2>
            <pre id="events"></pre>
            <h2>Análise:</h2>
            <pre id="analysis"></pre>
        </div>
    </div>

    <script>
        document.getElementById("fetchEvents").addEventListener("click", async () => {
            const response = await fetch("/api/k8s-events", {
                headers: {
                    "Authorization": "Basic " + btoa("admin:senha123")  // Altere conforme a autenticação
                }
            });
            const data = await response.json();
            document.getElementById("events").textContent = data.events;
            document.getElementById("analysis").textContent = data.analysis;
        });
    </script>
</body>
</html>
